; ============================================================
;  zones.ini - configuración del gestor de zonas
;  Formato de zona:  x, y, ancho, alto   (píxeles físicos)
; ============================================================

[General]
; Perfil con el que arranca el motor (al encender el PC): ultrawide | dual | centrado | normal
Profile=normal
; 1 = si una ventana colocada en una zona se sale de ella, recupera el tamaño que tenía antes de entrar
RestoreOnLeave=1

[Monitor]
; Tamaño total del escritorio. Solo se usa para validar que las zonas caben.
Width=5120
Height=1440

; ---- Perfil 1: ultrawide + lateral -------------------------
; GameZone = zona del modo juego: A, B, C o auto (por defecto: la zona donde esté la ventana). Se puede poner en cada perfil.
[Profile.ultrawide]
; A = izquierda (ultrawide), B = derecha (divisible en mitades apiladas)
A=0,0,3440,1440
B=3440,0,1680,1440

; ---- Perfil 2: dos mitades iguales -------------------------
GameZone=auto
[Profile.dual]
A=0,0,2560,1440
B=2560,0,2560,1440

[Profile.centrado]
; Pantalla 16:9 en el centro (A) y una zona a cada lado (B derecha, C izquierda) con lo que sobra.
A=1280,0,2560,1440
B=3840,0,1280,1440
C=0,0,1280,1440

[Profile.normal]
; Pantalla normal: sin zonas (no hay B). Ni atajos de colocación, ni encaje, ni vigilante.
A=0,0,5120,1440

; ---- Atajos de teclado -------------------------------------------
; Formato AutoHotkey: # = Win, ! = Alt, ^ = Ctrl, + = Mayús, y la tecla (z, Left, F5, BackSpace...).
; Se cambian cómodamente desde el panel (tarjeta «Atajos»). Si falta una línea, vale el atajo por defecto.
[Hotkeys]
ZoneMaximize=#!z
MoveToA=#!Left
MoveToB=#!Right
HalfTop=#!Up
HalfBottom=#!Down
GameMode=#!g
GameModeKeep=#!+g
CenterA=#!+Left
CenterB=#!+Right
Undo=#!BackSpace
SwitchProfile=#!p
ToggleWatcher=#!w
ToggleDim=#!o
ToggleDebug=#!d

; ---- Capa oscura (Win+Alt+O) ----------------------------------
[Dim]
; Opacidad del negro sobre la zona atenuada: 0 (nada) a 100 (negro puro)
Opacity=85

; ---- Encajar arrastrando (como FancyZones) -----------------
[Snap]
Enabled=1
; Tecla que hay que mantener mientras arrastras: Shift | Ctrl | Alt
Key=Shift
; 1 = al arrastrar con Shift se pueden elegir mitades (arriba/centro/abajo) en la zona B; 0 = solo izquierda o derecha, enteras
Halves=0

; ---- Vigilante de maximizado -------------------------------
[Watcher]
Enabled=1
; Cada cuántos ms revisa la ventana activa (mínimo 50)
IntervalMs=150

; Ventanas que el vigilante nunca toca (separadas por comas).
; Procesos: nombre del .exe. Clases: clase de ventana (ver Win+Alt+D en el paso 5).
[Exclusions]
Processes=
Classes=
; Juegos: el encaje con Shift, el vigilante y la restauración de tamaño no los tocan nunca
; (mover o redimensionar un juego en marcha puede soltarle el ratón). Nombres de .exe separados por comas.
Games=RainbowSix.exe

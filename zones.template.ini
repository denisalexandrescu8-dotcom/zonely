; ============================================================
;  zones.ini - configuración de Zonely
;  Formato de zona:  x, y, ancho, alto   (píxeles físicos)
;  Este archivo se crea la primera vez a partir de la plantilla, con las zonas
;  calculadas para el tamaño de tu monitor principal. Edítalo a mano o desde el panel.
; ============================================================

[General]
; Perfil con el que arranca el motor (al encender el PC): el nombre de cualquier [Profile.xxx]
Profile=normal
; 1 = si una ventana colocada en una zona se sale de ella, recupera el tamaño que tenía antes de entrar
RestoreOnLeave=1
; Solo macOS: 1 = icono de Zonely en la barra de menús; 0 = oculto (Zonely sigue funcionando)
MenuBarIcon=1

[Monitor]
; Tamaño total del escritorio. Solo se usa para validar que las zonas caben.
Width={{WIDTH}}
Height={{HEIGHT}}

; ---- Perfiles ----------------------------------------------------
; Cada sección [Profile.nombre] es un perfil: A, B (y C) son sus zonas. Sin B = pantalla normal, sin zonas.
; GameZone = zona del modo juego: A, B, C o auto (por defecto: la zona donde esté la ventana). Se puede poner en cada perfil.
{{PROFILES}}
; ---- Atajos de teclado -------------------------------------------
; Formato AutoHotkey: # = Win, ! = Alt, ^ = Ctrl, + = Mayús, y la tecla (z, Left, F5, BackSpace...).
; Se cambian cómodamente desde el panel (sección «Atajos»). Si falta una línea, vale el atajo por defecto.
[Hotkeys]
; Solo aparecen aquí los atajos que cambies (el panel los escribe). Los de fábrica están en el programa:
; Windows: Win+Alt+tecla (#!z)   ·   macOS: Control+Opción+tecla (^!z)

; ---- Capa oscura (Win+Alt+O) ----------------------------------
[Dim]
; Opacidad del negro sobre la zona atenuada: 0 (nada) a 100 (negro puro)
Opacity=85

; ---- Encajar arrastrando (como FancyZones) -----------------
[Snap]
Enabled=1
; Tecla que hay que mantener mientras arrastras: Shift | Ctrl | Alt
Key=Shift
; 1 = al arrastrar con Shift se pueden elegir mitades (arriba/centro/abajo) en la zona B; 0 = solo izquierda o derecha, enteras
Halves=0

; ---- Vigilante de maximizado -------------------------------
[Watcher]
Enabled=1
; Cada cuántos ms revisa la ventana activa (mínimo 50)
IntervalMs=150

; Ventanas que el vigilante nunca toca (separadas por comas).
; Procesos: nombre del .exe. Clases: clase de ventana (ver Win+Alt+D).
[Exclusions]
Processes=
Classes=
; Juegos: el encaje con Shift, el vigilante y la restauración de tamaño no los tocan nunca
; (mover o redimensionar un juego en marcha puede soltarle el ratón). Nombres de .exe separados por comas.
Games=RainbowSix.exe

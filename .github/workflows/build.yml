name: Build

# En cada cambio compila el instalador de Windows y lo guarda como artefacto.
# Al subir una etiqueta vX.Y.Z (que debe coincidir con version.txt) también crea la release con el instalador.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Descargar AutoHotkey v2 y Ahk2Exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.30/AutoHotkey_2.0.30.zip -OutFile tools/ahk.zip
          Invoke-WebRequest https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip -OutFile tools/a2e.zip
          Expand-Archive tools/ahk.zip -DestinationPath tools/ahk
          Expand-Archive tools/a2e.zip -DestinationPath tools/a2e
          Get-ChildItem tools -Recurse -Filter '*.exe' | Select-Object -ExpandProperty FullName

      - name: Instalar dependencias del panel
        working-directory: panel
        run: npm ci

      - name: Comprobar que la versión de la etiqueta coincide con version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          if ("v$v" -ne '${{ github.ref_name }}') { throw "La etiqueta ${{ github.ref_name }} no coincide con version.txt (v$v)." }

      - name: Construir el instalador
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Ahk2Exe "$PWD/tools/a2e/Ahk2Exe.exe" -AhkBase "$PWD/tools/ahk/AutoHotkey64.exe"

      - name: Suma de comprobación
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/installer -Filter 'Zonely-Setup-*.exe' | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content dist/installer/SHA256SUMS.txt
          Get-Content dist/installer/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Zonely-Setup
          path: |
            dist/installer/Zonely-Setup-*.exe
            dist/installer/SHA256SUMS.txt

      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem dist/installer -Filter 'Zonely-Setup-*.exe' | Select-Object -First 1).FullName
          $notes = "Zonely ${{ github.ref_name }}. Installer for Windows 10/11 (not code-signed: SmartScreen may warn, click More info > Run anyway). SHA-256 in SHA256SUMS.txt. / Instalador para Windows 10/11 (sin firmar: SmartScreen puede avisar). Cambios: CHANGELOG.md."
          gh release create '${{ github.ref_name }}' $exe dist/installer/SHA256SUMS.txt --title "Zonely ${{ github.ref_name }}" --notes $notes

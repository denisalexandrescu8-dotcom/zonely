name: Build

# En cada cambio: pruebas del motor de macOS y construcción de los instaladores (Windows y macOS) como artefactos.
# Al subir una etiqueta vX.Y.Z (que debe coincidir con version.txt) se crea además la release con los dos instaladores.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # Motor de macOS (Swift): compila y pasa las pruebas en cada cambio.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        working-directory: mac
        run: swift build
      - name: Pruebas
        working-directory: mac
        run: swift test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del actualizador de macOS (descarga, SHA-256 y guion de instalación)
        run: node panel/updater.test.js

  macos-app:
    # Instalador de macOS (.dmg, Apple Silicon). Sin certificado de Apple: se firma «ad hoc».
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Instalar dependencias del panel
        working-directory: panel
        run: npm ci

      - name: Construir el instalador
        run: bash scripts/build-mac.sh

      - name: Suma de comprobación
        run: |
          cd dist/installer
          shasum -a 256 Zonely-*.dmg | tee SHA256SUMS-mac.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Zonely-Mac
          path: |
            dist/installer/Zonely-*.dmg
            dist/installer/SHA256SUMS-mac.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Descargar AutoHotkey v2 y Ahk2Exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools | Out-Null
          Invoke-WebRequest https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.30/AutoHotkey_2.0.30.zip -OutFile tools/ahk.zip
          Invoke-WebRequest https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip -OutFile tools/a2e.zip
          Expand-Archive tools/ahk.zip -DestinationPath tools/ahk
          Expand-Archive tools/a2e.zip -DestinationPath tools/a2e

      - name: Instalar dependencias del panel
        working-directory: panel
        run: npm ci

      - name: Construir el instalador
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -Ahk2Exe "$PWD/tools/a2e/Ahk2Exe.exe" -AhkBase "$PWD/tools/ahk/AutoHotkey64.exe"

      - name: Suma de comprobación
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/installer -Filter 'Zonely-Setup-*.exe' | Select-Object -First 1
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content dist/installer/SHA256SUMS-windows.txt
          Get-Content dist/installer/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Zonely-Windows
          path: |
            dist/installer/Zonely-Setup-*.exe
            dist/installer/Zonely-Setup-*.exe.blockmap
            dist/installer/latest.yml
            dist/installer/SHA256SUMS-windows.txt

  release:
    # Solo con una etiqueta vX.Y.Z: reúne los dos instaladores y crea la release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, macos-app, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la versión de la etiqueta coincide con version.txt
        run: |
          v="$(tr -d '[:space:]' < version.txt)"
          if [ "v$v" != "${{ github.ref_name }}" ]; then echo "La etiqueta ${{ github.ref_name }} no coincide con version.txt (v$v)." >&2; exit 1; fi

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release-files
          cat release-files/SHA256SUMS-*.txt > release-files/SHA256SUMS.txt
          rm release-files/SHA256SUMS-*.txt
          gh release create "${{ github.ref_name }}" release-files/* \
            --title "Zonely ${{ github.ref_name }}" \
            --notes "Zonely ${{ github.ref_name }}. Windows 10/11: Zonely-Setup-*.exe. macOS (Apple Silicon): Zonely-*-mac-arm64.dmg. Installers are not code-signed: Windows SmartScreen may warn (More info > Run anyway); on macOS right-click the app > Open the first time. SHA-256 in SHA256SUMS.txt. / Instaladores sin firmar: SmartScreen puede avisar; en macOS, clic derecho > Abrir la primera vez. Cambios: CHANGELOG.md."
